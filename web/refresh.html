<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Обновить токен</title>

<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #262b36;
    --text: #e6e8eb;
    --muted: #8b93a1;
    --accent: #4f7cff;
    --accent-hover: #3d68ea;
    --error: #ff5c5c;
    --success: #3ecf8e;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 520px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px;
  }

  .wide { max-width: 760px; }

  h1 {
    font-size: 20px;
    margin: 0 0 24px;
    font-weight: 600;
  }

  label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .field { margin-bottom: 16px; }

  input, textarea {
    width: 100%;
    padding: 10px 12px;
    background: #0f1115;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s;
  }

  textarea {
    min-height: 140px;
    resize: vertical;
  }

  input:focus, textarea:focus { border-color: var(--accent); }

  button {
    width: 100%;
    padding: 11px;
    margin-top: 8px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: white;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }

  button:hover { background: var(--accent-hover); }
  button:disabled { opacity: 0.6; cursor: not-allowed; }

  .danger { background: #b84040; }
  .danger:hover { background: #9f3333; }

  .msg {
    margin-top: 14px;
    font-size: 13px;
    text-align: center;
    min-height: 18px;
  }

  .msg.error { color: var(--error); }
  .msg.success { color: var(--success); }

  .result {
    margin-top: 18px;
    padding: 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #0f1115;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    font-size: 13px;
  }

  .post {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 12px;
    background: #0f1115;
  }

  .post h2 {
    margin: 0 0 8px;
    font-size: 17px;
  }

  .post p {
    margin: 0;
    line-height: 1.5;
    color: var(--text);
  }

  .meta {
    margin-top: 10px;
    color: var(--muted);
    font-size: 12px;
  }
</style>

</head>
<body>
<div class="card">

  <h1>Обновить access token</h1>
  <button id="btn">Refresh</button>
  <div class="msg" id="msg"></div>
  <div class="result" id="result" hidden></div>

</div>
<script>

const btn = document.getElementById('btn');
const msg = document.getElementById('msg');
const result = document.getElementById('result');

btn.addEventListener('click', async () => {
  msg.textContent = '';
  msg.className = 'msg';

  try {
    const res = await fetch('/refresh', {
      method: 'POST',
      credentials: 'include'
    });

    const data = await res.json().catch(() => ({}));

    if (res.ok) {
      msg.textContent = 'Access token обновлён.';
      msg.classList.add('success');
      result.hidden = false;
      result.textContent = JSON.stringify(data, null, 2);
    } else {
      msg.textContent = data.message || data.error || 'Не удалось обновить токен.';
      msg.classList.add('error');
    }
  } catch {
    msg.textContent = 'Ошибка сети.';
    msg.classList.add('error');
  }
});

</script>
</body>
</html>
