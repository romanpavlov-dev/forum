<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forum</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #262b36;
    --text: #e6e8eb;
    --muted: #8b93a1;
    --accent: #4f7cff;
    --accent-hover: #3d68ea;
    --error: #ff5c5c;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
  }

  header {
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .nav {
    max-width: 900px;
    margin: 0 auto;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .brand {
    font-size: 20px;
    font-weight: 700;
  }

  .actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .actions a {
    text-decoration: none;
    color: white;
    background: var(--accent);
    padding: 9px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
  }

  .actions a:hover {
    background: var(--accent-hover);
  }

  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 28px 20px 48px;
  }

  .page-title {
    margin: 0 0 20px;
    font-size: 24px;
  }

  .msg {
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 16px;
  }

  .msg.error {
    color: var(--error);
  }

  .post {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 14px;
    cursor: pointer;
    transition: border-color 0.15s, transform 0.15s;
  }

  .post:hover {
    border-color: var(--accent);
    transform: translateY(-1px);
  }

  .post h2 {
    margin: 0 0 10px;
    font-size: 18px;
  }

  .post p {
    margin: 0;
    line-height: 1.55;
    color: var(--text);
    white-space: pre-wrap;
  }

  .meta {
    margin-top: 12px;
    color: var(--muted);
    font-size: 12px;
  }

  .empty {
    padding: 24px;
    border: 1px dashed var(--border);
    border-radius: 12px;
    color: var(--muted);
    text-align: center;
  }
</style>
</head>

<body>
<header>
  <div class="nav">
    <div class="brand">Forum</div>

    <div class="actions">
      <a href="/login.html">Войти</a>
      <a href="/register.html">Регистрация</a>
      <a href="/create_post.html">Создать пост</a>
    </div>
  </div>
</header>

<main>
  <h1 class="page-title">Последние посты</h1>
  <div class="msg" id="msg">Загрузка...</div>
  <div id="posts"></div>
</main>

<script>
  const msg = document.getElementById('msg');
  const postsEl = document.getElementById('posts');

  async function loadPosts() {
    try {
      const res = await fetch('/posts', {
        method: 'GET',
        credentials: 'include'
      });

      const data = await res.json().catch(() => []);

      if (!res.ok) {
        msg.textContent = data.message || data.error || 'Не удалось загрузить посты.';
        msg.className = 'msg error';
        return;
      }

      msg.textContent = '';

      if (!Array.isArray(data) || data.length === 0) {
        postsEl.innerHTML = '<div class="empty">Постов пока нет.</div>';
        return;
      }

      for (const post of data) {
        const card = document.createElement('article');
        card.className = 'post';

        const title = document.createElement('h2');
        title.textContent = post.title || 'Без названия';

        const content = document.createElement('p');
        content.textContent = post.content || '';

        const meta = document.createElement('div');
        meta.className = 'meta';

        const postId = post.id ?? '-';
        const userId = post.user_id ?? '-';

        meta.textContent = `Post ID: ${postId} · User ID: ${userId}`;

        if (post.id !== undefined && post.id !== null) {
          card.addEventListener('click', () => {
            window.location.href = `/get_post.html?id=${post.id}`;
          });
        }

        card.append(title, content, meta);
        postsEl.appendChild(card);
      }
    } catch (err) {
      msg.textContent = 'Ошибка сети. Не удалось загрузить посты.';
      msg.className = 'msg error';
    }
  }

  loadPosts();
</script>
</body>
</html>
